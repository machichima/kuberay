name: Flaky test tracker

on:
  schedule:
    # Runs once a day at 03:23 UTC (a random time).
    - cron: '23 3 * * *'
  workflow_dispatch: {}

jobs:
  flaky-tracker:
    runs-on: ubuntu-latest
    permissions:
      issues: write  # Required to create issues.

    steps:
      - name: Open issues for new flaky tests
        env:
          BUILDKITE_API_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The Buildkite-Version header is required for the labels= and branch= filters.
          # See https://buildkite.com/docs/apis/rest-api/test-engine/tests
          bk() {
            curl -sfS -H "Authorization: Bearer $BUILDKITE_API_TOKEN" -H 'Buildkite-Version: 2026-08-01' \
              "https://api.buildkite.com/v2/analytics/organizations/ray-project/suites/kuberay-e2e/$1"
          }

          # Fetch the test cases that Buildkite Test Engine has labelled "flaky" on the master branch.
          # master in the last day. We don't expect many flaky tests, so only the first 100 are fetched.
          # Go subtests ("TestFoo/Bar") are skipped, we only open issue for top-level tests.
          bk 'tests?labels=flaky&branch=master&period=28days&per_page=100' \
            | jq '[.[] | select(.name | contains("/") | not)]' > tests.json
          if [ "$(jq length tests.json)" -eq 0 ]; then
            echo "No flaky tests found"
            exit 0
          fi

          # Map test id to public build URLs.
          # The Tests API only gives the test ID, so we start from recent builds on master -> get their Test Engine runs
          # -> then match the test IDs returned by failed_executions to find the failed builds of each test.
          # We look at runs rather than build state because a flaky job is usually retried, which turns the build green.
          # Since this workflow runs daily, new flaky tests always have recent failures, so scanning only the 20 most recent
          # builds is enough, and it keeps us under the 50 requests/minute API rate limit.
          curl -sfS -H "Authorization: Bearer $BUILDKITE_API_TOKEN" \
            "https://api.buildkite.com/v2/organizations/ray-project/pipelines/ray-ecosystem-ci-kuberay-ci/builds?branch=master&per_page=20" \
            | jq -r '.[].id' > builds.txt
          for build in $(cat builds.txt); do
            for run in $(bk "runs?build_id=$build" | jq -r '.[].id'); do
              bk "runs/$run/failed_executions"
            done
          done |
            # Group the failed executions by test id into {test_id: ["<commit sha> <job URL>", ...]},
            # so each issue below can list the builds its test failed in.
            # The build URL and job id are execution tags (set by run_env in .buildkite/hooks/pre-exit),
            # and "#<job id>" makes the build page open that job directly.
            jq -s 'add // []
                | group_by(.test_id)
                | map({(.[0].test_id): map(.commit_sha[0:7] + " " + .tags["build.url"] + "#" + .tags["build.job_id"]) | unique})
                | add // {}' > builds.json

          # Skip tests that already have an open issue. The test URL in the body is the dedup key.
          gh issue list --state open --label flaky-tracker --limit 1000 --json body --jq '.[].body' > issues.txt

          # $1: Test Engine URL of the test, $2: reliability summary, $3: markdown list of failed builds.
          issue_body() {
            cat <<EOF
          $1

          Reliability on master in the last 28 days: $2

          Recent failed builds on master:
          $3

          Generated by the flaky-test tracker workflow. The Test Engine link in the beginning is used to detect duplicate issues, please keep it.
          EOF
          }

          jq -c '.[]' tests.json | while read -r t; do
            id=$(jq -r .id <<< "$t")
            url=$(jq -r .web_url <<< "$t")
            if grep -qF "$url" issues.txt; then
              continue
            fi
            reliability=$(jq -r '"\((.reliability // 0) * 100 | round)% (\(.executions_count_by_result.passed) passed, \(.executions_count_by_result.failed) failed)"' <<< "$t")
            builds=$(jq -r --arg id "$id" '.[$id] // [] | .[] | "- " + .' builds.json)
            gh issue create --label flaky-tracker,ci,flaky,P0,triage \
              --title "[CI] \`$(jq -r .name <<< "$t")\` is flaky on master" \
              --body "$(issue_body "$url" "$reliability" "$builds")"
          done
